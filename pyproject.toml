[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridiron-guillotine"
version = "2.1.0"
description = "Championship Fantasy Football Draft Strategy with Hero-RB and Advanced Metrics"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Gridiron Guillotine Project"}
]
keywords = ["fantasy", "football", "draft", "strategy", "hero-rb", "analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Games/Entertainment :: Sports",
]
requires-python = ">=3.8"
dependencies = [
    "beautifulsoup4>=4.11.0",
    "requests>=2.28.0",
    "pandas>=1.5.0",
    "tqdm>=4.64.0",
    "seaborn>=0.11.0",
    "selenium>=4.5.0",
    "scipy>=1.9.0",
    "streamlit>=1.25.0",
    "streamlit-aggrid>=0.3.0",
    "webdriver_manager>=3.8.0",
    "yahoo_fantasy_api>=2.5.0",
    "yahoo_oauth>=1.0.0",
    "click>=8.0.0",
    "pydantic>=1.10.0",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=5.0.0",
    "mypy>=0.991",
    "pre-commit>=2.20.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.8.0",
]

[project.urls]
Homepage = "https://github.com/gridiron-guillotine/gridiron-guillotine"
Repository = "https://github.com/gridiron-guillotine/gridiron-guillotine"
Documentation = "https://github.com/gridiron-guillotine/gridiron-guillotine/blob/main/CLAUDE.md"
"Bug Tracker" = "https://github.com/gridiron-guillotine/gridiron-guillotine/issues"

[project.scripts]
gridiron = "gridiron_guillotine.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gridiron_guillotine*"]

[tool.setuptools.package-data]
gridiron_guillotine = ["py.typed"]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# mypy configuration
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "yahoo_fantasy_api.*",
    "yahoo_oauth.*",
    "streamlit.*",
    "st_aggrid.*",
    "selenium.*",
    "webdriver_manager.*",
]
ignore_missing_imports = true

# pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["gridiron_guillotine"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]